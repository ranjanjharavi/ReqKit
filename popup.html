<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <main class="tabs-shell">
      <div class="tabs-list" role="tablist" aria-label="Utility features">
        <button id="transformer-tab" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="transformer-panel" data-tab="transformer">URL transform</button>
        <button id="headers-tab" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="headers-panel" data-tab="headers">Headers</button>
      </div>

      <section id="transformer-panel" class="tab-panel active" data-panel="transformer" role="tabpanel" aria-labelledby="transformer-tab">
        <article class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Build an auth redirect URL</h2>
            <span class="panel-brand">ReqKit</span>
          </div>

          <div class="content-stack">
            <div class="field">
              <label for="sourceUrl">Source URL</label>
              <div class="transformer-source-row">
                <input type="text" id="sourceUrl" placeholder="https://example.com/path or example.com/path" autocapitalize="off" autocorrect="off" spellcheck="false">
                <button id="transformUrlBtn" class="primary-btn transformer-inline-action" type="button">Transform</button>
              </div>
            </div>

            <div class="field">
              <label for="authToken">Auth token</label>
              <div class="token-entry-row">
                <div class="input-icon-wrapper">
                  <input type="password" id="authToken" placeholder="Stored locally on this browser" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                  <button id="toggleTokenVisibility" class="input-eye-btn" type="button" aria-label="Show token" title="Show token"><svg class="eye-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1.5 8C3 5 5.3 3.5 8 3.5S13 5 14.5 8C13 11 10.7 12.5 8 12.5S3 11 1.5 8Zm6.5 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-1.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg></button>
                </div>
                <button id="saveTokenBtn" class="small-btn rule-icon-btn token-save-btn" type="button" aria-label="Save token to library" title="Save token to library"><svg class="rule-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v11.47a.5.5 0 0 1-.78.41L8 11.58l-3.22 2.3A.5.5 0 0 1 4 13.47V2Z"/></svg></button>
              </div>
              <p class="helper-text">Paste a token, save it locally, and keep one active token selected below.</p>
            </div>

            <div id="transformedUrlField" class="field transformer-output" hidden>
              <div class="transformer-output-head">
                <label for="transformedUrl">Transformed URL</label>
                <div class="transformer-output-actions" role="group" aria-label="Transformed URL actions">
                  <button id="copyUrlBtn" class="transformer-output-action" type="button" aria-label="Copy transformed URL" title="Copy URL" disabled>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5.5 2A1.5 1.5 0 0 0 4 3.5v7A1.5 1.5 0 0 0 5.5 12h5A1.5 1.5 0 0 0 12 10.5v-7A1.5 1.5 0 0 0 10.5 2h-5ZM3 3.5A2.5 2.5 0 0 1 5.5 1h5A2.5 2.5 0 0 1 13 3.5v7a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 3 10.5v-7Z"/><path fill="currentColor" d="M1 5.5A2.5 2.5 0 0 1 3.5 3H4v1h-.5A1.5 1.5 0 0 0 2 5.5v7A1.5 1.5 0 0 0 3.5 14h5A1.5 1.5 0 0 0 10 12.5V12h1v.5A2.5 2.5 0 0 1 8.5 15h-5A2.5 2.5 0 0 1 1 12.5v-7Z"/></svg>
                  </button>
                  <button id="openUrlBtn" class="transformer-output-action" type="button" aria-label="Open transformed URL in Incognito" title="Open in Incognito" disabled>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9 2h5v5h-1.5V4.56L7.03 10.03 5.97 8.97l5.47-5.47H9V2Z"/><path fill="currentColor" d="M3.5 3h4v1.5h-4v8h8v-4H13v4a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 2 12.5v-8A1.5 1.5 0 0 1 3.5 3Z"/></svg>
                  </button>
                </div>
              </div>
              <textarea id="transformedUrl" rows="4" readonly></textarea>
            </div>

            <div id="transformerStatus" class="status-msg"></div>

            <div class="field">
              <div class="token-library-head">
                <div class="field-label">Saved tokens</div>
                <span id="tokenLibraryCount" class="token-count-pill">0 saved</span>
              </div>
              <div id="tokenListContainer" class="token-list"></div>
            </div>

          </div>
        </article>
      </section>

      <section id="headers-panel" class="tab-panel" data-panel="headers" role="tabpanel" aria-labelledby="headers-tab" hidden>
        <article class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Manage request headers</h2>
            <span class="panel-brand">ReqKit</span>
          </div>

          <div class="content-stack">
            <div class="current-site-toolbar">
              <div class="current-site-summary">
                <span class="current-site-dot" aria-hidden="true"></span>
                <div class="current-site-copy">
                  <span class="current-site-label">Current host</span>
                  <span id="currentSiteHost" class="current-site-host" aria-live="polite">Detecting current site…</span>
                </div>
              </div>
              <div class="rule-view-toggle" role="group" aria-label="Filter header rules">
                <button id="currentSiteViewBtn" class="rule-view-btn active" type="button" data-rule-view="current" aria-pressed="true">Current site <span id="currentSiteViewCount" class="rule-view-count">0</span></button>
                <button id="allHostsViewBtn" class="rule-view-btn" type="button" data-rule-view="all" aria-pressed="false">All hosts <span id="allHostsViewCount" class="rule-view-count">0</span></button>
              </div>
            </div>

            <div id="headerComposer" class="header-composer">
              <button id="headerComposerToggle" class="header-composer-toggle" type="button" aria-expanded="false" aria-controls="headerComposerBody">
                <span class="header-composer-icon" aria-hidden="true">
                  <svg viewBox="0 0 16 16"><path fill="currentColor" d="M7.25 2.5h1.5v4.75h4.75v1.5H8.75v4.75h-1.5V8.75H2.5v-1.5h4.75V2.5Z"/></svg>
                </span>
                <span class="header-composer-copy">
                  <span class="header-composer-title">Add header rule</span>
                  <span id="headerComposerHint" class="header-composer-hint">Create an exact-host rule</span>
                </span>
                <svg class="header-composer-chevron" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="m4.2 6.1 3.8 3.8 3.8-3.8 1.05 1.05L8 12 3.15 7.15 4.2 6.1Z"/></svg>
              </button>

              <div id="headerComposerBody" class="header-composer-body" hidden>
                <form id="headerComposerForm" class="header-composer-form">
                  <div class="field">
                    <label for="domain">Exact host</label>
                    <input type="text" id="domain" placeholder="example.com or https://example.com/path">
                    <p class="helper-text">Only the hostname is used. Paths are ignored.</p>
                  </div>

                  <div class="field">
                    <label for="headerName">Header name</label>
                    <input type="text" id="headerName" placeholder="X-Custom-Auth">
                  </div>

                  <div class="field">
                    <label for="headerValue">Header value</label>
                    <input type="text" id="headerValue" placeholder="token-or-static-value">
                  </div>

                  <div class="action-row header-composer-actions">
                    <button id="addHeaderBtn" class="primary-btn" type="submit">Add rule</button>
                    <button id="cancelHeaderComposerBtn" class="secondary-btn" type="button">Cancel</button>
                  </div>
                </form>
              </div>
            </div>

            <div id="headerStatus" class="status-msg"></div>
            <div id="ruleSearchContainer" class="rule-search" hidden>
              <label class="sr-only" for="ruleSearchInput">Search header rules</label>
              <svg class="rule-search-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 2a5 5 0 1 0 3.16 8.87l2.98 2.98 1.06-1.06-2.98-2.98A5 5 0 0 0 7 2Zm-3.5 5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"/></svg>
              <input id="ruleSearchInput" type="search" placeholder="Search hosts and headers" autocomplete="off" spellcheck="false">
            </div>
            <div id="ruleListContainer" class="rule-list"></div>
          </div>
        </article>
      </section>

    </main>
  </div>

  <script type="module" src="popup/main.js"></script>
</body>
</html>
