<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReqKit store screenshot</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      display: grid;
      place-items: center;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(96, 165, 250, 0.2), transparent 34%),
        radial-gradient(circle at 82% 76%, rgba(59, 130, 246, 0.18), transparent 36%),
        linear-gradient(145deg, #f8fbff, #eaf3ff);
    }
    .frame {
      width: 680px;
      height: 790px;
      padding: 30px;
      overflow: hidden;
      border: 1px solid rgba(147, 197, 253, 0.8);
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 28px 80px rgba(30, 64, 175, 0.2);
    }
    iframe {
      width: 480px;
      height: 560px;
      border: 0;
      transform: scale(1.29);
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="frame"><iframe id="popupPreview" title="ReqKit extension popup"></iframe></div>
  <script>
    document.getElementById('popupPreview').src = 'popup-harness.html?store=5&headers=1';
  </script>
</body>
</html>
